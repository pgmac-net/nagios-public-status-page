[project]
name = "nagios-public-status-page"
version = "0.1.0"
description = "A public-facing status page that displays Nagios monitoring data with incident tracking and RSS feeds"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Paul Macdonnell", email = "pgmac@pgmac.net" }
]
maintainers = [
    { name = "Paul Macdonnell", email = "pgmac@pgmac.net" }
]
keywords = [
    "nagios",
    "monitoring",
    "status-page",
    "incidents",
    "rss",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Framework :: FastAPI",
]
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.2",
    "fastapi>=0.128.0",
    "feedgen>=1.0.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.21",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.40.0",
]

[project.urls]
Homepage = "https://github.com/pgmac/nagios-public-status-page"
Repository = "https://github.com/pgmac/nagios-public-status-page"
Issues = "https://github.com/pgmac/nagios-public-status-page/issues"
Documentation = "https://github.com/pgmac/nagios-public-status-page#readme"

[project.scripts]
status-page = "nagios_public_status_page.main:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py313"

# Rules are selected explicitly so a new ruff release cannot change what CI
# enforces by turning additional rules on by default.
[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors (ruff's default subset)
    "F",               # pyflakes
    "I",               # isort
    "UP",              # pyupgrade
    "B",               # flake8-bugbear
    "SIM",             # flake8-simplify
    "RUF",             # ruff-specific
    "DTZ",             # flake8-datetimez
    "TRY",             # tryceratops
    "BLE",             # blind except
]

ignore = [
    # Requires a custom exception class per message; not worth it for an app
    # this size, where the message at the raise site is the useful documentation.
    "TRY003",
    # FastAPI routes raise HTTPException inside try blocks by design.
    "TRY301",
    # Conflicts with pylint's no-else-raise (R1720) on try/except/else.
    "TRY300",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's documented idiom is a call in the parameter default.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]
