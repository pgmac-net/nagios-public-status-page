services:
  status-page:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nagios-status-page
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount Nagios var directory (read-only) - mounting the directory instead of the file
      # ensures updates work correctly when Nagios does atomic writes
      - /usr/local/nagios/var:/nagios/var:ro
      # Mount database directory for persistence
      - ./data:/app/data
      # Mount config (optional - can use environment variables instead)
      - ./config.yaml:/app/config.yaml:ro
    environment:
      # Values below are read from a .env file in this directory, falling back to
      # the defaults after ':-' when unset. Copy .env.example to .env and edit
      # that; do not edit this file, which is tracked in git.
      #
      # Timestamps are stored and served as UTC; see docs/UTC_TIMESTAMPS.md.
      # Deliberately not overridable.
      - TZ=UTC
      # Paths inside the container, fixed by the volume mounts above
      - NAGIOS_STATUS_DAT_PATH=/nagios/var/status.dat
      - DATABASE_PATH=/app/data/status.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-*}
      # Hostgroups and servicegroups (comma-separated)
      - NAGIOS_HOSTGROUPS=${NAGIOS_HOSTGROUPS:-public-status}
      - NAGIOS_SERVICEGROUPS=${NAGIOS_SERVICEGROUPS:-public-status-services}
      # Polling configuration
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-300}
      - STALENESS_THRESHOLD_SECONDS=${STALENESS_THRESHOLD_SECONDS:-600}
      # Basic Auth for write operations. Set these in .env, never here.
      - API_BASIC_AUTH_USERNAME=${API_BASIC_AUTH_USERNAME:-}
      - API_BASIC_AUTH_PASSWORD=${API_BASIC_AUTH_PASSWORD:-}
      # Signed nagiosgraph proxy (used by /api/graph, e.g. for Slack notifications).
      # GRAPH_SIGNING_SECRET is a secret: set it in .env, never here.
      - GRAPH_NAGIOSGRAPH_URL=${GRAPH_NAGIOSGRAPH_URL:-}
      - GRAPH_SIGNING_SECRET=${GRAPH_SIGNING_SECRET:-}
      - GRAPH_DEFAULT_TTL_SECONDS=${GRAPH_DEFAULT_TTL_SECONDS:-604800}
      - GRAPH_BASIC_AUTH_USERNAME=${GRAPH_BASIC_AUTH_USERNAME:-}
      - GRAPH_BASIC_AUTH_PASSWORD=${GRAPH_BASIC_AUTH_PASSWORD:-}
      # RSS configuration
      - RSS_TITLE=${RSS_TITLE:-System Status}
      - RSS_LINK=${RSS_LINK:-https://status.example.com}
      - RSS_DESCRIPTION=${RSS_DESCRIPTION:-Public status updates}
      - RSS_MAX_ITEMS=${RSS_MAX_ITEMS:-50}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - status-net

networks:
  status-net:
    driver: bridge

volumes:
  status-data:
    driver: local
